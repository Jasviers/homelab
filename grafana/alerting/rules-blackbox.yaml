apiVersion: 1

groups:
  - orgId: 1
    name: homelab-blackbox
    folder: Alerts
    interval: 1m
    rules:
      - uid: blackbox-icmp-host-down
        title: "Host sin respuesta a ping"
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: probe_success{job="blackbox-icmp"}
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} no responde a ping desde hace 5 minutos"
          description: "Comprobar alimentación/red del host antes de asumir que es un problema del propio servicio -- si es zoro/nami, esto también tumba las VMs que aloja."

      - uid: blackbox-http-service-down
        title: "Servicio HTTP sin responder"
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: probe_success{job="blackbox-http"}
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} no devuelve 2xx desde hace 5 minutos"
          description: "Puede ser el backend, Envoy Gateway, o Authentik si el servicio va tras SSO -- revisar en ese orden."
