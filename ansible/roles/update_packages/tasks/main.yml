---
- name: Update apt package index
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade all packages to the latest version
  ansible.builtin.apt:
    upgrade: dist
    autoclean: true

- name: Remove unused packages
  ansible.builtin.apt:
    autoremove: true
    purge: true
