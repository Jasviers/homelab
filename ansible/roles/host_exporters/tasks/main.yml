---
- name: Install node_exporter (paquete Debian)
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present

- name: Ensure node_exporter is enabled and running
  ansible.builtin.systemd:
    name: prometheus-node-exporter
    enabled: true
    state: started

- name: Install smartmontools (dependencia de smartctl_exporter)
  ansible.builtin.apt:
    name: smartmontools
    state: present

- name: Check if smartctl_exporter binary is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/smartctl_exporter
  register: host_exporters_smartctl_exporter_bin

- name: Create temp dir for smartctl_exporter download
  ansible.builtin.tempfile:
    state: directory
    prefix: smartctl_exporter
  register: host_exporters_smartctl_exporter_tmp
  when: not host_exporters_smartctl_exporter_bin.stat.exists

- name: Download and extract smartctl_exporter
  ansible.builtin.unarchive:
    src: "https://github.com/prometheus-community/smartctl_exporter/\
      releases/download/v{{ host_exporters_smartctl_exporter_version }}/\
      smartctl_exporter-{{ host_exporters_smartctl_exporter_version }}.\
      linux-{{ host_exporters_smartctl_exporter_arch }}.tar.gz"
    dest: "{{ host_exporters_smartctl_exporter_tmp.path }}"
    remote_src: true
  when: not host_exporters_smartctl_exporter_bin.stat.exists

- name: Install smartctl_exporter binary to /usr/local/bin
  ansible.builtin.copy:
    src: >-
      {{ host_exporters_smartctl_exporter_tmp.path }}/smartctl_exporter-{{
      host_exporters_smartctl_exporter_version }}.linux-{{
      host_exporters_smartctl_exporter_arch }}/smartctl_exporter
    dest: /usr/local/bin/smartctl_exporter
    mode: "0755"
    remote_src: true
  when: not host_exporters_smartctl_exporter_bin.stat.exists

- name: Clean up smartctl_exporter temp dir
  ansible.builtin.file:
    path: "{{ host_exporters_smartctl_exporter_tmp.path }}"
    state: absent
  when: not host_exporters_smartctl_exporter_bin.stat.exists

- name: Deploy smartctl_exporter systemd unit
  ansible.builtin.template:
    src: smartctl-exporter.service.j2
    dest: /etc/systemd/system/smartctl-exporter.service
    owner: root
    group: root
    mode: "0644"
  register: host_exporters_smartctl_exporter_unit

- name: Enable and (re)start smartctl_exporter
  ansible.builtin.systemd:
    name: smartctl-exporter
    enabled: true
    state: >-
      {{ 'restarted' if (host_exporters_smartctl_exporter_unit.changed or not
      host_exporters_smartctl_exporter_bin.stat.exists) else 'started' }}
    daemon_reload: "{{ host_exporters_smartctl_exporter_unit.changed }}"
