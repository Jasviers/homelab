---
- name: Check if k3s server service unit exists (control-plane)
  ansible.builtin.stat:
    path: /etc/systemd/system/k3s.service
  register: install_k3s_server_unit

- name: Check if k3s-agent service unit exists (workers)
  ansible.builtin.stat:
    path: /etc/systemd/system/k3s-agent.service
  register: install_k3s_agent_unit

- name: Determine control-plane API address
  vars:
    cp_host: "{{ groups['k3s_control_plane'][0] }}"
  ansible.builtin.set_fact:
    install_k3s_cp_address: >-
      {{ hostvars[cp_host].ansible_default_ipv4.address }}

- name: Install k3s on init control-plane node
  ansible.builtin.shell: |
    set -o pipefail
    curl -sfL https://get.k3s.io | sh -s - server \
      --write-kubeconfig-mode "0644" \
      --cluster-init \
      --node-taint node-role.kubernetes.io/control-plane=true:NoSchedule \
      --flannel-backend=none \
      --disable-network-policy \
      --disable-kube-proxy \
      --disable servicelb \
      --disable traefik \
      --disable local-storage \
      --etcd-arg heartbeat-interval=500 \
      --etcd-arg election-timeout=5000
  when:
    - inventory_hostname == groups['k3s_control_plane'][0]
    - not install_k3s_server_unit.stat.exists
  changed_when: true

- name: Wait for k3s service to be ready on init control-plane node
  ansible.builtin.systemd:
    name: k3s
    state: started
  when: inventory_hostname == groups['k3s_control_plane'][0]

- name: Get token from init control-plane node
  ansible.builtin.command: cat /var/lib/rancher/k3s/server/token
  register: install_k3s_token
  delegate_to: "{{ groups['k3s_control_plane'][0] }}"
  run_once: true
  changed_when: false

- name: Install k3s on the rest of the control-plane nodes
  ansible.builtin.shell: |
    set -o pipefail
    curl -sfL https://get.k3s.io | sh -s - server \
      --write-kubeconfig-mode "0644" \
      --cluster-init \
      --node-taint node-role.kubernetes.io/control-plane=true:NoSchedule \
      --flannel-backend=none \
      --disable-network-policy \
      --disable-kube-proxy \
      --disable servicelb \
      --disable traefik \
      --disable local-storage \
      --etcd-arg heartbeat-interval=500 \
      --etcd-arg election-timeout=5000 \
      --server https://{{ install_k3s_cp_address }}:6443 \
      --token "{{ install_k3s_token.stdout }}"
  when:
    - inventory_hostname in groups['k3s_control_plane']
    - inventory_hostname != groups['k3s_control_plane'][0]
    - not install_k3s_server_unit.stat.exists
  changed_when: true

- name: Install k3s on worker nodes
  ansible.builtin.shell: |
    set -o pipefail
    curl -sfL https://get.k3s.io | sh -s - agent \
      --server https://{{ install_k3s_cp_address }}:6443 \
      --token "{{ install_k3s_token.stdout }}" \
      --node-label bonchan.org/gateway-node=true
  when:
    - inventory_hostname in groups['k3s_workers']
    - not install_k3s_agent_unit.stat.exists
  changed_when: true

- name: Enable etcd metrics endpoint for Prometheus (control-plane only)
  ansible.builtin.blockinfile:
    path: /etc/rancher/k3s/config.yaml
    create: true
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - etcd-expose-metrics"
    block: |
      etcd-expose-metrics: true
  when: inventory_hostname in groups['k3s_control_plane']
  register: install_k3s_etcd_metrics_config

- name: Restart k3s to apply etcd metrics config (control-plane only)
  ansible.builtin.systemd:
    name: k3s
    state: restarted
  when:
    - inventory_hostname in groups['k3s_control_plane']
    - install_k3s_etcd_metrics_config is changed

- name: Fetch k3s config from init control-plane node only
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: ~/.kube/config
    flat: true
  when: inventory_hostname == groups['k3s_control_plane'][0]

- name: Update kubeconfig server URL
  ansible.builtin.lineinfile:
    path: ~/.kube/config
    regexp: '^\s*server:\s*https://127\.0\.0\.1:6443'
    line: "    server: https://{{ install_k3s_cp_address }}:6443"
  delegate_to: localhost
  become: false
  run_once: true

- name: Add Cilium Helm repository
  ansible.builtin.command: >-
    helm repo add cilium {{ install_k3s_cilium_helm_repo_url }}
  delegate_to: localhost
  become: false
  run_once: true
  register: install_k3s_cilium_repo_add
  changed_when: "'has been added' in install_k3s_cilium_repo_add.stdout"

- name: Update Cilium Helm repository
  ansible.builtin.command: helm repo update cilium
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false

- name: Render Cilium values
  ansible.builtin.template:
    src: cilium-values.yaml.j2
    dest: /tmp/cilium-values.yaml
    mode: "0644"
  delegate_to: localhost
  become: false
  run_once: true
  vars:
    install_k3s_cilium_k8s_service_host: "{{ install_k3s_cp_address }}"

- name: Install/upgrade Cilium via Helm
  ansible.builtin.shell: >
    helm upgrade --install cilium cilium/cilium
    --version {{ install_k3s_cilium_chart_version }}
    --namespace kube-system
    --kubeconfig {{ install_k3s_cilium_kubeconfig }}
    --values /tmp/cilium-values.yaml
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: true

- name: Wait for Cilium DaemonSet rollout
  ansible.builtin.shell: >
    kubectl --kubeconfig {{ install_k3s_cilium_kubeconfig }}
    -n kube-system rollout status ds/cilium --timeout=300s
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
