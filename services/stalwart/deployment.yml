apiVersion: apps/v1
kind: Deployment
metadata:
  name: stalwart
  namespace: stalwart
  labels:
    app.kubernetes.io/name: stalwart
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: stalwart
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stalwart
    spec:
      securityContext:
        fsGroup: 2000
      containers:
        - name: stalwart
          image: stalwartlabs/stalwart:v0.16.16
          imagePullPolicy: Always
          env:
            - name: LDAP_BIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stalwart-ldap-secrets
                  key: bind-password
          ports:
            - name: smtp
              containerPort: 25
            - name: submission
              containerPort: 587
            - name: submissions
              containerPort: 465
            - name: imap
              containerPort: 143
            - name: imaptls
              containerPort: 993
            - name: sieve
              containerPort: 4190
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_BIND_SERVICE
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /opt/stalwart
            - name: config
              mountPath: /opt/stalwart/etc/config.toml
              subPath: config.toml
            - name: mail-cert
              mountPath: /certs/mail-bonchan-org
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: stalwart-data
        - name: config
          configMap:
            name: stalwart-config
        - name: mail-cert
          secret:
            secretName: mail-bonchan-org-tls
