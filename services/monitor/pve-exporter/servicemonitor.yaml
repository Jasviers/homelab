apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pve-exporter
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pve-exporter
  namespaceSelector:
    matchNames:
      - monitoring
  endpoints:
    - port: http
      path: /pve
      interval: 60s
      scrapeTimeout: 30s
      params:
        module: [default]
        cluster: ["1"]
        node: ["1"]
        target: [192.168.1.3]
      relabelings:
        - sourceLabels: [__param_target]
          targetLabel: instance
          replacement: zoro
    - port: http
      path: /pve
      interval: 60s
      scrapeTimeout: 30s
      params:
        module: [default]
        node: ["1"]
        target: [192.168.1.4]
      relabelings:
        - sourceLabels: [__param_target]
          targetLabel: instance
          replacement: nami
