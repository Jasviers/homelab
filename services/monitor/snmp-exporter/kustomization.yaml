apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - servicemonitors.yaml

helmCharts:
  - name: prometheus-snmp-exporter
    repo: https://prometheus-community.github.io/helm-charts
    version: 9.17.1
    releaseName: snmp-exporter
    namespace: monitoring
    valuesInline:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
