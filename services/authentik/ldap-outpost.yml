apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-ldap-outpost
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik-ldap-outpost
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik-ldap-outpost
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik-ldap-outpost
    spec:
      containers:
        - name: ldap
          image: ghcr.io/goauthentik/ldap:2026.5.3
          env:
            - name: AUTHENTIK_HOST
              value: http://authentik-server.authentik.svc.cluster.local/
            - name: AUTHENTIK_INSECURE
              value: "true"
            - name: AUTHENTIK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: authentik-ldap-outpost
                  key: token
          ports:
            - name: ldap
              containerPort: 3389
              protocol: TCP
            - name: ldaps
              containerPort: 6636
              protocol: TCP
            - name: metrics
              containerPort: 9300
              protocol: TCP
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-ldap
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik-ldap-outpost
  annotations:
    lbipam.cilium.io/ips: 192.168.1.130
spec:
  type: LoadBalancer
  ports:
    - name: ldap
      port: 389
      targetPort: ldap
      protocol: TCP
    - name: ldaps
      port: 636
      targetPort: ldaps
      protocol: TCP
  selector:
    app.kubernetes.io/name: authentik-ldap-outpost
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-ldap-metrics
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik-ldap-metrics
spec:
  ports:
    - name: metrics
      port: 9300
      targetPort: metrics
      protocol: TCP
  selector:
    app.kubernetes.io/name: authentik-ldap-outpost
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: authentik-ldap-outpost
  namespace: authentik
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik-ldap-metrics
  namespaceSelector:
    matchNames:
      - authentik
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
