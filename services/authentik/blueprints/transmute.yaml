version: 1
metadata:
  name: transmute-oidc
  labels:
    blueprints.goauthentik.io/instance: transmute-oidc
context:
  transmute_client_secret: !Env [TRANSMUTE_CLIENT_SECRET, ""]
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: transmute-provider
    identifiers:
      name: Transmute
    attrs:
      name: Transmute
      client_type: confidential
      client_id: transmute
      client_secret: !Context transmute_client_secret
      grant_types:
        - authorization_code
        - refresh_token
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      # OIDC nativo de Transmute: redirect_uri = origin(APP_URL) + /api/oidc/callback
      redirect_uris:
        - matching_mode: strict
          url: https://transmute.bonchan.org/api/oidc/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    id: transmute-app
    identifiers:
      slug: transmute
    attrs:
      name: Transmute
      slug: transmute
      provider: !KeyOf transmute-provider
      meta_launch_url: https://transmute.bonchan.org
      meta_description: Convertidor/compresor de medios
      group: Aplicaciones
