version: 1
metadata:
  name: jellyfin-oidc
  labels:
    blueprints.goauthentik.io/instance: jellyfin-oidc
context:
  jellyfin_client_secret: !Env [JELLYFIN_CLIENT_SECRET, ""]
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: jellyfin-provider
    identifiers:
      name: Jellyfin
    attrs:
      name: Jellyfin
      client_type: confidential
      client_id: jellyfin
      client_secret: !Context jellyfin_client_secret
      grant_types:
        - authorization_code
        - refresh_token
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      # Callback del plugin SSO-Auth; "authentik" es el nombre de provider que se
      # configura en el propio plugin (Dashboard > Plugins > SSO-Auth), debe coincidir.
      redirect_uris:
        - matching_mode: strict
          url: https://jellyfin.bonchan.org/sso/OID/redirect/authentik
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    id: jellyfin-app
    identifiers:
      slug: jellyfin
    attrs:
      name: Jellyfin
      slug: jellyfin
      provider: !KeyOf jellyfin-provider
      meta_launch_url: https://jellyfin.bonchan.org
      meta_description: Servidor multimedia
      group: Media
